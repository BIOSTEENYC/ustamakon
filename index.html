        /* Splash screen specific styles - no translucent background */

        /* Download Modal Styles */
        .modal-overlay {

<body>
    <div id="app-container"></div>

    <!-- PDF.js kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>
        // PDF.js worker URL
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        // Obfuskatsiya kaliti (Dart kodidan olingan)
        const _obfuscationKey = 0x5A;

        // Baytlarni XOR operatsiyasi bilan obfuskatsiya qilish (Dart kodidan olingan)
        function _xorBytes(bytes) {
            const result = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) {
                result[i] = bytes[i] ^ _obfuscationKey;
            }
            return result;
        }

        // Responsive o'lchamlar uchun yordamchi funksiya (Flutterdagi responsiveSize ga o'xshash)
        function responsiveSize(baseSize) {
            const shortestSide = Math.min(window.innerWidth, window.innerHeight);
            const baseShortestSide = 360.0; // Flutterdagi qiymat
            return baseSize * (shortestSide / baseShortestSide);
        }

        function responsiveTextSize(baseFontSize) {
            const shortestSide = Math.min(window.innerWidth, window.innerHeight);
            const baseShortestSide = 360.0;
            return baseFontSize * Math.max(0.8, Math.min(1.5, (shortestSide / baseShortestSide)));
        }

        // Ma'lumotlarni saqlash uchun localStorage dan foydalanish
        const HIVE_SUBJECTS_BOX_NAME = 'subjectsBox';
        const HIVE_SETTINGS_BOX_NAME = 'settingsBox';
        const ONBOARDING_DONE_KEY = 'onboardingDone';
        // LAST_SUCCESSFUL_PRELOAD_KEY va OFFLINE_MODE_KEY olib tashlandi

        // MD5 hash funksiyasi (CryptoJS dan foydalaniladi)
        // CryptoJS CDN
        const loadScript = (src) => {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        };

        let CryptoJS; // CryptoJS ni global scope da e'lon qilish

        async function initCryptoJS() {
            if (!window.CryptoJS) {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js');
                CryptoJS = window.CryptoJS;
            } else {
                CryptoJS = window.CryptoJS;
            }
        }

        function generateMd5(str) {
            if (!CryptoJS) {
                console.error("CryptoJS yuklanmagan!");
                return btoa(str).replace(/=/g, ''); // Fallback to base64
            }
            return CryptoJS.MD5(str).toString();
        }

        // --- Data Models (Dartdagi HiveType ga o'xshash) ---
        class Subject {
            constructor({ id, name, iconUrl, topicListUrl, categories = [], emoji = '' }) {
                this.id = id;
                this.name = name;
                this.iconUrl = iconUrl;
                this.topicListUrl = topicListUrl;
                this.categories = categories.map(cat => new Category(cat));
                this.emoji = emoji;
            }

            static fromJson(json) {
                const name = json.name ?? 'Noma\'lum Fan';
                const id = json.id ?? generateMd5(name + (json.topic_list_url ?? ''));
                return new Subject({
                    id: id,
                    name: name,
                    iconUrl: json.icon_url ?? '',
                    topicListUrl: json.topic_list_url ?? '',
                    emoji: json.emoji ?? '',
                    categories: [], // Kategoriyalar keyinroq yuklanadi
                });
            }

            toJson() {
                return {
                    id: this.id,
                    name: this.name,
                    iconUrl: this.iconUrl,
                    topicListUrl: this.topicListUrl,
                    categories: this.categories.map(cat => cat.toJson()),
                    emoji: this.emoji,
                };
            }
        }

        class Category {
            constructor({ id, name, iconEmoji, guides = [] }) {
                this.id = id;
                this.name = name;
                this.iconEmoji = iconEmoji;
                this.guides = guides.map(guide => new Guide(guide));
            }

            static fromJson(json) {
                const categoryName = json.category_name ?? 'Noma\'lum Kategoriya';
                const icon = json.icon_emoji ?? '❓';
                return new Category({
                    id: generateMd5(categoryName),
                    name: categoryName,
                    iconEmoji: icon,
                    guides: (json.guides || []).map(guideJson => Guide.fromJson(guideJson)),
                });
            }

            toJson() {
                return {
                    id: this.id,
                    name: this.name,
                    iconEmoji: this.iconEmoji,
                    guides: this.guides.map(guide => guide.toJson()),
                };
            }
        }

        class Guide {
            constructor({ id, title, iconEmoji, documentUrl }) {
                this.id = id;
                this.title = title;
                this.iconEmoji = iconEmoji;
                this.documentUrl = documentUrl;
            }

            static fromJson(json) {
                const guideTitle = json.title ?? 'Noma\'lum Mavzu';
                const icon = json.icon_emoji ?? ' ';
                const docUrl = json.document_url ?? '';
                return new Guide({
                    id: generateMd5(guideTitle + docUrl),
                    title: guideTitle,
                    iconEmoji: icon,
                    documentUrl: docUrl,
                });
            }

            toJson() {
                return {
                    id: this.id,
                    title: this.title,
                    iconEmoji: this.iconEmoji,
                    documentUrl: this.documentUrl,
                };
            }
        }

        // --- Data Service ---
        class DataService {
            constructor() {
                this._subjectsBox = JSON.parse(localStorage.getItem(HIVE_SUBJECTS_BOX_NAME) || '{}');
                this._subjectsJsonUrl = 'https://raw.githubusercontent.com/BIOSTEENYC/ustamakon/main/documents/subjects.json';
            }

            async fetchSubjects({ forceRefresh = false } = {}) {
                let subjectsFromNetwork = [];
                try {
                    console.log('DataService: Fanlar internetdan yuklanmoqda:', this._subjectsJsonUrl);
                    const response = await fetch(this._subjectsJsonUrl);
                    if (!response.ok) {
                        throw new Error(`DataService: Fanlarni yuklashda xatolik (${response.status}): ${response.statusText}`);
                    }
                    const decodedBody = await response.text();
                    const decodedJson = JSON.parse(decodedBody);
                    console.log('DataService: subjects.json fayli yuklandi:', decodedJson);


                    if (decodedJson && decodedJson.subjects && Array.isArray(decodedJson.subjects)) {
                        for (const data of decodedJson.subjects) {
                            if (typeof data === 'object' && data !== null) {
                                const subject = Subject.fromJson(data);
                                // Keshda mavjud bo'lsa, kategoriyalarni yangilash
                                const existingSubjectData = this._subjectsBox[subject.id];
                                if (existingSubjectData) {
                                    const existingSubject = new Subject(existingSubjectData);
                                    subject.categories = existingSubject.categories;
                                }
                                if (subject.topicListUrl && subject.categories.length === 0) {
                                    subject.categories = await this.fetchCategoriesForSubject(subject, { forceRefresh: true });
                                }
                                subjectsFromNetwork.push(subject);
                            } else {
                                throw new Error(`DataService: Subject ma'lumoti kutilgan Map formatida emas: ${data}`);
                            }
                        }

                        // localStorage ni yangilash
                        this._subjectsBox = {};
                        for (const subject of subjectsFromNetwork) {
                            this._subjectsBox[subject.id] = subject.toJson();
                        }
                        localStorage.setItem(HIVE_SUBJECTS_BOX_NAME, JSON.stringify(this._subjectsBox));

                        console.log(`DataService: Fanlar internetdan yuklandi va localStorage ga saqlandi (count: ${subjectsFromNetwork.length})`);
                        return subjectsFromNetwork;
                    } else {
                        throw new Error('DataService: Kutilmagan JSON formati subjects.json uchun. Javob Map emas yoki "subjects" kaliti yo\'q.');
                    }
                } catch (e) {
                    console.error('DataService: Fanlarni yuklashda xatolik:', e);
                    const cachedSubjectsData = Object.values(this._subjectsBox);
                    if (cachedSubjectsData.length > 0) {
                        console.log('DataService: Xatolik yuz berdi, localStorage dagi eski fanlar qaytarildi.');
                        return cachedSubjectsData.map(s => new Subject(s));
                    }
                    throw new Error(`DataService: Fanlar yuklanmadi va keshda ham mavjud emas. Xatolik: ${e.message}`);
                }
            }

            async fetchCategoriesForSubject(subject, { forceRefresh = false } = {}) {
                if (!subject.topicListUrl) {
                    console.warn(`DataService: "${subject.name}" uchun topicListUrl bo'sh. Kategoriyalar yuklanmaydi.`);
                    return [];
                }

                if (!forceRefresh && subject.categories.length > 0) {
                    console.log(`DataService: "${subject.name}" uchun kategoriyalar localStorage (Subject ichidan) dan olindi.`);
                    return subject.categories;
                }

                try {
                    console.log(`DataService: "${subject.name}" uchun kategoriyalar internetdan yuklanmoqda: ${subject.topicListUrl}`);
                    const response = await fetch(subject.topicListUrl);
                    if (!response.ok) {
                        throw new Error(`DataService: Kategoriyalarni yuklashda xatolik (${response.status}): ${response.statusText} URL: ${subject.topicListUrl}`);
                    }
                    const decodedData = await response.json();
                    console.log(`DataService: "${subject.name}" uchun kategoriya JSON yuklandi:`, decodedData);

                    const categories = decodedData.map(data => {
                        if (typeof data === 'object' && data !== null) {
                            return Category.fromJson(data);
                        } else {
                            throw new Error(`DataService: Category ma'lumoti kutilgan Map formatida emas: ${data}`);
                        }
                    });

                    console.log(`DataService: "${subject.name}" uchun kategoriyalar internetdan yuklandi (count: ${categories.length})`);
                    subject.categories = categories;
                    // Subjectni localStorage da yangilash
                    this._subjectsBox[subject.id] = subject.toJson();
                    localStorage.setItem(HIVE_SUBJECTS_BOX_NAME, JSON.stringify(this._subjectsBox));
                    return categories;
                } catch (e) {
                    console.error(`DataService: Kategoriyalarni yuklashda xatolik ("${subject.name}"):`, e);
                    if (subject.categories.length > 0) {
                        console.log(`DataService: Xatolik yuz berdi, "${subject.name}" uchun localStorage dagi eski kategoriyalar qaytarildi.`);
                        return subject.categories;
                    }
                    return [];
                }
            }

            async loadPdfBytes(url) {
                if (!url) {
                    console.log('PdfService: PDF URL bo\'sh, yuklash bekor qilindi.');
                    return null;
                }

                try {
                    console.log(`PdfService: PDF (obfuskatsiya qilingan) internetdan yuklanmoqda: ${url}`);
                    const response = await fetch(url);

                    if (!response.ok) {
                        throw new Error(`PdfService: PDF yuklashda xatolik (${response.status}): ${response.statusText} URL: ${url}`);
                    }
                    const obfuscatedBytesFromServer = new Uint8Array(await response.arrayBuffer());

                    if (obfuscatedBytesFromServer.length === 0) {
                        console.log(`PdfService: PDF internetdan bo'sh baytlar bilan keldi: ${url}`);
                        throw new Error('Serverdan bo\'sh PDF fayl keldi.');
                    }

                    console.log(`PdfService: PDF (obfuskatsiya qilingan) internetdan yuklandi: ${url}. Baytlar soni: ${obfuscatedBytesFromServer.length}`);
                    return _xorBytes(obfuscatedBytesFromServer);
                } catch (e) {

                    return null;
                }
            }

        // --- Preload Manager ---
        class PreloadManager {
            constructor() {
                this.progress = 0.0;
                this.status = "Tayyorlanmoqda...";
                this.error = null;
                this.listeners = []; // UI ni yangilash uchun tinglovchilar
            }

            _notifyListeners() {
                this.listeners.forEach(callback => callback());
            }

            addListener(callback) {
                this.listeners.push(callback);
            }

            removeListener(callback) {
                this.listeners = this.listeners.filter(cb => cb !== callback);
            }

            async preloadAllData() { // forceRefresh parametri olib tashlandi
                try {
                    this.error = null;
                    this.status = "Fanlar ro'yxati yuklanmoqda...";
                    this.progress = 0.05;
                    this._notifyListeners();

                    const dataService = new DataService();
                    const settingsBox = JSON.parse(localStorage.getItem(HIVE_SETTINGS_BOX_NAME) || '{}');

                    await new Promise(resolve => setTimeout(resolve, 100));

                    let subjects = [];
                    // Har doim internetdan yuklashga urinish
                    subjects = await dataService.fetchSubjects({ forceRefresh: true }); // Har doim majburiy yangilash

                    if (subjects.length === 0) {
                        throw new Error("Fanlar topilmadi. Internet aloqasini tekshiring yoki keyinroq urinib ko'ring.");
                    }
                    this.status = "Fanlar yuklandi. Kategoriyalar tekshirilmoqda...";
                    this._notifyListeners();

                    // Kategoriyalarni yuklash
                    for (let i = 0; i < subjects.length; i++) {
                        const subject = subjects[i];
                        if (subject.topicListUrl && subject.categories.length === 0) {
                            this.status = `'${subject.name}' uchun kategoriyalar yuklanmoqda...`;
                            this._notifyListeners();
                            subject.categories = await dataService.fetchCategoriesForSubject(subject, { forceRefresh: true }); // Har doim majburiy yangilash
                            // Subjectni localStorage da yangilash
                            const subjectsData = JSON.parse(localStorage.getItem(HIVE_SUBJECTS_BOX_NAME) || '{}');
                            subjectsData[subject.id] = subject.toJson();
                            localStorage.setItem(HIVE_SUBJECTS_BOX_NAME, JSON.stringify(subjectsData));
                        }
                        this.progress = 0.35 + (0.60 * ((i + 1) / subjects.length)); // Progressni 0.95 gacha olib borish
                        this._notifyListeners();
                    }

                    this.progress = 1.0;
                    this.status = "Barcha ma'lumotlar yuklandi!";
                    this._notifyListeners();
                    // LAST_SUCCESSFUL_PRELOAD_KEY olib tashlandi
                } catch (e) {
                    console.error("PreloadManager: Ma'lumotlarni oldindan yuklashda xatolik:", e);
                    this.error = `Xatolik: \n${e.message}\nIltimos, internet aloqangizni tekshiring va qayta urinib ko'ring.`;
                    this.progress = 0.0;
                    this._notifyListeners();
                }
            }
        }

        function createPdfViewerScreen(pdfUrl, guideTitle) {
            const screen = document.createElement('div');
            screen.className = 'flex flex-col flex-grow';
            screen.prepend(createHeader(guideTitle));

            const mainContentArea = document.createElement('div'); // PDF canvas va loading state uchun asosiy kontent maydoni
            mainContentArea.className = 'flex-grow flex flex-col items-center justify-center overflow-y-auto'; // Bu qism aylantiriladi
            screen.appendChild(mainContentArea);

            const loadingState = document.createElement('div');
            loadingState.className = 'flex flex-col items-center justify-center p-5 text-center';
            loadingState.innerHTML = `
                <div class="loading-spinner mb-5"></div>
                <p id="pdf-status" class="text-lg text-center mb-2 text-white"></p>
                <div class="progress-bar-container w-full max-w-sm">
                    <div id="pdf-progress" class="progress-bar"></div>
                </div>
            `;
            mainContentArea.appendChild(loadingState); // loadingState ni mainContentArea ga qo'shish

            const pdfCanvas = document.createElement('canvas');
            pdfCanvas.id = 'pdf-canvas';
            pdfCanvas.className = 'hidden'; // Dastlab yashirish
            mainContentArea.appendChild(pdfCanvas); // pdfCanvas ni mainContentArea ga qo'shish

            const pdfControls = document.createElement('div');
            pdfControls.id = 'pdf-controls';
            pdfControls.className = 'pdf-controls hidden';
            pdfControls.innerHTML = `
                <button id="prev-page"><i class="fas fa-chevron-left"></i> Oldingi</button>
                <span id="page-num"></span> / <span id="page-count"></span>
                <button id="next-page">Keyingi <i class="fas fa-chevron-right"></i></button>
                <button id="zoom-in"><i class="fas fa-search-plus"></i></button>
                <button id="zoom-out"><i class="fas fa-search-minus"></i></button>
                <button id="reload-pdf"><i class="fas fa-sync-alt"></i> Qayta yuklash</button>
            `;
            screen.appendChild(pdfControls); // pdfControls ni screen ga qo'shish, shunda u pastda qoladi

            // Elementlarga murojaatlarni ularni DOMga qo'shgandan keyin olish
            const prevPageBtn = pdfControls.querySelector('#prev-page');
            const nextPageBtn = pdfControls.querySelector('#next-page');
            const zoomInBtn = pdfControls.querySelector('#zoom-in');
            const zoomOutBtn = pdfControls.querySelector('#zoom-out');
            const reloadPdfBtn = pdfControls.querySelector('#reload-pdf');
            const pageNumSpan = pdfControls.querySelector('#page-num');
            const pageCountSpan = pdfControls.querySelector('#page-count');


            const statusElement = loadingState.querySelector('#pdf-status');
            const progressElement = loadingState.querySelector('#pdf-progress');

            let pdfDoc = null;
            let pageNum = 1;
            let pageRendering = false;
            let pageNumPending = null;
            let currentScale = 1.0; // Masshtabni nazorat qilish uchun

            async function renderPage(num) {
                pageRendering = true;
                const page = await pdfDoc.getPage(num);
                
                // Joriy masshtabdan foydalanish
                const viewport = page.getViewport({ scale: currentScale });

                const context = pdfCanvas.getContext('2d');
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport,
                };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });

                pageNumSpan.textContent = num;
            }

            function queueRenderPage(num) {
                if (pageRendering) {
                    pageNumPending = num;
                } else {
                    renderPage(num);
                }
            }

            function onPrevPage() {
                if (pageNum <= 1) {
                    return;
                }
                pageNum--;
                queueRenderPage(pageNum);
            }

            function onNextPage() {
                if (pageNum >= pdfDoc.numPages) {
                    return;
                }
                pageNum++;
                queueRenderPage(pageNum);
            }

            function onZoomIn() {
                currentScale = Math.min(currentScale + 0.25, 3.0); // Maksimal zoom chegarasi
                queueRenderPage(pageNum);
            }

            function onZoomOut() {
                currentScale = Math.max(currentScale - 0.25, 0.5); // Minimal zoom chegarasi
                queueRenderPage(pageNum);
            }

            // Tugmalarga hodisa tinglovchilarni ularni DOMga qo'shgandan keyin biriktirish
            prevPageBtn.onclick = onPrevPage;
            nextPageBtn.onclick = onNextPage;
            zoomInBtn.onclick = onZoomIn;
            zoomOutBtn.onclick = onZoomOut;
            reloadPdfBtn.onclick = () => loadPdf(); // loadPdf ga to'g'ridan-to'g'ri chaqirish

            async function loadPdf() {
                loadingState.classList.remove('hidden');
                pdfCanvas.classList.add('hidden');
                pdfControls.classList.add('hidden');
                statusElement.textContent = "PDF yuklanmoqda...";
                progressElement.style.width = '0%';
                let errorMessage = null;

                try {
                    console.log(`PdfViewerScreen: PDF yuklash boshlandi. URL: ${pdfUrl}`);
                    progressElement.style.width = '10%';
                    statusElement.textContent = "Fayl yuklanmoqda...";
                    await new Promise(resolve => setTimeout(resolve, 300));

                    const bytes = await pdfService.loadPdfBytes(pdfUrl);
                    console.log(`PdfViewerScreen: PDF baytlari olindi. Mavjudligi: ${!!bytes}, uzunligi: ${bytes ? bytes.length : 0}`);


                    progressElement.style.width = '70%';
                    statusElement.textContent = "Fayl yuklandi. Ko'rsatishga tayyorlanmoqda...";
                    await new Promise(resolve => setTimeout(resolve, 300));

                    if (bytes && bytes.length > 0) {
                        const pdfData = bytes.buffer;
                        console.log('PdfViewerScreen: PDF.js hujjatni yuklamoqda...');
                        pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
                        console.log('PdfViewerScreen: PDF hujjat yuklandi. Sahifalar soni:', pdfDoc.numPages);
                        pageCountSpan.textContent = pdfDoc.numPages;
                        pageNum = 1;

                        // Birinchi sahifani yuklashda masshtabni hisoblash
                        const firstPage = await pdfDoc.getPage(1);
                        const initialViewport = firstPage.getViewport({ scale: 1 });
                        const desiredWidth = pdfCanvas.clientWidth;
                        currentScale = desiredWidth / initialViewport.width; // Kenglikka moslashish

                        renderPage(pageNum);

                        loadingState.classList.add('hidden');
                        pdfCanvas.classList.remove('hidden');
                        pdfControls.classList.remove('hidden');
                        progressElement.style.width = '100%';
                        statusElement.textContent = "Tayyor!";
                    } else {
                        throw new Error("PDF faylini yuklab bo'lmadi yoki bo'sh. Internetni yoqib qayta yuklashni bosing.");
                    }
                } catch (e) {
                    console.error('PdfViewerScreen: PDF yuklashda xatolik:', e);
                    errorMessage = `Xatolik: ${e.message}`;
                    loadingState.classList.remove('hidden');
                    pdfCanvas.classList.add('hidden');
                    pdfControls.classList.add('hidden');
                    statusElement.textContent = "Xatolik yuz berdi!";
                    progressElement.style.width = '0%';

                    // Xato xabarini ko'rsatish
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'full-screen-message';
                    errorDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle icon"></i>
                        <h2>PDFni yuklashda xatolik yuz berdi:</h2>
                        <p>${errorMessage}</p>
                        <button id="error-retry-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg flex items-center space-x-2 mt-4">
                            <i class="fas fa-sync-alt"></i>
                            <span>Qayta urinish</span>
                        </button>
                    `;
                    mainContentArea.innerHTML = ''; // Oldingi yuklash holatini tozalash
                    mainContentArea.appendChild(errorDiv);
                    errorDiv.querySelector('#error-retry-button').onclick = () => loadPdf();
                }
            }

            loadPdf(); // Ekranga kirganda PDFni yuklash

            // Oynani o'lchash hodisasi tinglovchisi
            window.addEventListener('resize', async () => {
                if (pdfDoc && !pageRendering) { // Agar PDF yuklangan bo'lsa va sahifa chizilmayotgan bo'lsa
                    console.log('Oyna o\'lchami o\'zgardi, PDF sahifasi qayta chizilmoqda.');
                    // Joriy sahifani olish
                    const currentPage = await pdfDoc.getPage(pageNum);
                    const currentViewport = currentPage.getViewport({ scale: 1 });
                    const desiredWidth = pdfCanvas.clientWidth;
                    currentScale = desiredWidth / currentViewport.width; // Yangi kenglikka moslashish

                    renderPage(pageNum); // Joriy sahifani qayta chizish
                }
            });

            return screen;
        }

        function createOnboardingScreen() {
            const screen = document.createElement('div');
            screen.className = 'flex flex-col flex-grow';

            const pageView = document.createElement('div');
            pageView.className = 'flex-grow relative overflow-hidden';
            screen.appendChild(pageView);

            const pages = [
                { title: "Xush kelibsiz!", description: "UstaMakon ilovasi orqali turli sohalardagi qo'llanmalarni toping.", icon: "fas fa-school" },
                { title: "Oson Foydalanish", description: "Kerakli fan yoki mavzuni tanlang va PDF hujjatlarni o'qing.", icon: "fas fa-file-pdf" },
                { title: "Ma'lumotlar doimiy yangi", description: "Barcha ma'lumotlar internetdan yuklanadi va doim yangilanadi.", icon: "fas fa-cloud-download-alt" }, // Matn o'zgartirildi
            ];

            let currentPageIndex = 0;

            const renderOnboardingPage = (index) => {
                pageView.innerHTML = '';
                const pageData = pages[index];
                const pageDiv = document.createElement('div');
                pageDiv.className = 'onboarding-page';
                pageDiv.innerHTML = `
                    <i class="${pageData.icon}"></i>
                    <h2>${pageData.title}</h2>
                    <p>${pageData.description}</p>
                `;
                pageView.appendChild(pageDiv);

                updateDots(index);
                updateButtonText(index);
            };

            const updateDots = (activeIndex) => {
                dotsContainer.innerHTML = '';
                pages.forEach((_, index) => {
                    const dot = document.createElement('div');
                    dot.className = `onboarding-dot ${index === activeIndex ? 'active' : ''}`;
                    dotsContainer.appendChild(dot);
                });
            };

            const updateButtonText = (activeIndex) => {
                nextButton.textContent = activeIndex < pages.length - 1 ? "Keyingisi" : "Boshlash";
            };

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'onboarding-dots';

            const footer = document.createElement('div');
            footer.className = 'onboarding-footer';
            const nextButton = document.createElement('button');
            nextButton.textContent = "Keyingisi";
            nextButton.onclick = () => {
                if (currentPageIndex < pages.length - 1) {
                    currentPageIndex++;
                    renderOnboardingPage(currentPageIndex);
                } else {
                    const settingsBox = JSON.parse(localStorage.getItem(HIVE_SETTINGS_BOX_NAME) || '{}');
                    settingsBox[ONBOARDING_DONE_KEY] = true;
                    localStorage.setItem(HIVE_SETTINGS_BOX_NAME, JSON.stringify(settingsBox));
                    checkOnboardingAndPreload();
                }
            };
            footer.appendChild(dotsContainer);
            footer.appendChild(nextButton);
            screen.appendChild(footer);

            renderOnboardingPage(currentPageIndex); // Birinchi sahifani yuklash

            return screen;
        }

        // --- Ilovani ishga tushirish logikasi ---
        async function checkOnboardingAndPreload() {
            await initCryptoJS(); // CryptoJS ni ishga tushirish
            const settingsBox = JSON.parse(localStorage.getItem(HIVE_SETTINGS_BOX_NAME) || '{}');
            const onboardingDone = settingsBox[ONBOARDING_DONE_KEY] ?? false;

            if (!onboardingDone) {
                navigateTo('onboarding');
            } else {
                // Asosiy oqim boshlanishida tarixni tozalash
                historyStack = [];
                navigateTo('splash');
                await preloadManager.preloadAllData(); // forceRefresh parametri olib tashlandi

                // Avtomatik o'tish uchun kechikish
                setTimeout(() => {
                    if (preloadManager.error) {
                        navigateTo('error');
                    } else {
                        navigateTo('main');
                    }
                }, 1500); // 1.5 soniya kechikish
            }
        }

        // Brauzerning orqaga tugmasini boshqarish endi ishlatilmaydi, chunki o'zimizning navigateBack bor
        // window.onpopstate = () => { navigateTo('main'); }; // Bu qator olib tashlandi

        // Ilovani ishga tushirish
