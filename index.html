<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustamakon Hujjatlari</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Asosiy ranglar va fontlar uchun stil */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* PDF ko'ruvchi uchun konteyner stili */
        #pdf-viewer-container {
            width: 100%;
            max-width: 960px; /* Maksimal kenglik, kattaroq ekranlar uchun */
            margin: 0 auto;
            overflow-x: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        /* Canvas elementining o'lchamini va fon rangini boshqarish */
        #pdf-canvas {
            display: block;
            background-color: #f7fafc;
        }

        /* Modal xabari uchun stil */
        #message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 2rem;
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            z-index: 100;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <!-- Asosiy konteyner -->
    <div id="app-container" class="min-h-screen flex flex-col p-4 md:p-8">
        <!-- Loader va xato xabari uchun joy -->
        <div id="loader" class="hidden flex-grow flex items-center justify-center">
            <svg class="h-12 w-12 animate-spin text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <div id="error-message" class="hidden flex-grow flex items-center justify-center p-4 text-red-500 font-bold text-center"></div>

        <!-- Fanlar sahifasi -->
        <div id="subjects-page" class="w-full">
            <h1 class="text-3xl md:text-4xl font-bold mb-6 text-center text-gray-800">Ustamakon Hujjatlari</h1>
            <div id="subjects-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Fanlar ro'yxati shu yerga joylanadi -->
            </div>
        </div>

        <!-- Mavzular sahifasi -->
        <div id="topics-page" class="hidden w-full">
            <div class="flex items-center mb-6">
                <button id="back-to-subjects" class="flex items-center text-blue-600 hover:text-blue-800 transition-colors">
                    <!-- ChevronLeft SVG ikonkasi -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left h-6 w-6 mr-2"><path d="m15 18-6-6 6-6"/></svg>
                    <span class="text-lg font-semibold">Orqaga</span>
                </button>
                <h2 id="topics-title" class="text-2xl md:text-3xl font-bold ml-4"></h2>
            </div>
            <div id="topics-list" class="space-y-6">
                <!-- Mavzular ro'yxati shu yerga joylanadi -->
            </div>
        </div>

        <!-- Hujjat sahifasi -->
        <div id="document-page" class="hidden flex-grow flex flex-col items-center w-full">
            <button id="back-to-topics" class="flex items-center text-blue-600 hover:text-blue-800 transition-colors mb-4 self-start">
                <!-- ChevronLeft SVG ikonkasi -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left h-6 w-6 mr-2"><path d="m15 18-6-6 6-6"/></svg>
                <span class="text-lg font-semibold">Orqaga</span>
            </button>
            <div class="flex justify-between w-full max-w-4xl mb-4">
                <button id="prev-page" class="flex items-center px-4 py-2 bg-blue-500 text-white rounded-lg disabled:bg-gray-400 transition-colors">
                    Oldingi sahifa
                </button>
                <span id="page-info" class="text-lg font-semibold">Sahifa ... / ...</span>
                <button id="next-page" class="flex items-center px-4 py-2 bg-blue-500 text-white rounded-lg disabled:bg-gray-400 transition-colors">
                    Keyingi sahifa
                </button>
            </div>
            <div id="pdf-viewer-container">
                <canvas id="pdf-canvas"></canvas>
            </div>
        </div>
    </div>
    
    <!-- Modal xabari uchun element -->
    <div id="message-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div id="message-box" class="p-8 bg-white rounded-lg shadow-xl text-center">
            <p id="modal-text" class="text-lg font-semibold text-gray-800 mb-4"></p>
            <button id="modal-close-btn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                Yopish
            </button>
        </div>
    </div>

    <!-- pdf.js kutubxonasi CDN orqali -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <script>
        // Global o'zgaruvchilar va holatni boshqarish uchun obyekt
        const state = {
            currentPage: 'subjects',
            selectedSubject: null,
            selectedDocumentUrl: null,
            subjects: [],
            topics: [],
            pdfRef: null,
            pageNumber: 1,
            numPages: null,
            loading: false,
            error: null,
        };

        const SUBJECTS_URL = "https://raw.githubusercontent.com/BIOSTEENYC/ustamakon/main/documents/subjects.json";
        const XOR_KEY = 0x5A;

        // Elementlarga tez kirish uchun referenslar
        const elements = {
            appContainer: document.getElementById('app-container'),
            loader: document.getElementById('loader'),
            errorMessage: document.getElementById('error-message'),
            subjectsPage: document.getElementById('subjects-page'),
            subjectsList: document.getElementById('subjects-list'),
            topicsPage: document.getElementById('topics-page'),
            topicsTitle: document.getElementById('topics-title'),
            topicsList: document.getElementById('topics-list'),
            documentPage: document.getElementById('document-page'),
            backToSubjectsBtn: document.getElementById('back-to-subjects'),
            backToTopicsBtn: document.getElementById('back-to-topics'),
            prevPageBtn: document.getElementById('prev-page'),
            nextPageBtn: document.getElementById('next-page'),
            pageInfo: document.getElementById('page-info'),
            pdfCanvas: document.getElementById('pdf-canvas'),
            messageModal: document.getElementById('message-modal'),
            modalText: document.getElementById('modal-text'),
            modalCloseBtn: document.getElementById('modal-close-btn'),
        };

        /**
         * PDF faylini deobfuskatsiya qilish funksiyasi.
         * @param {Uint8Array} obfuscatedBytes Obfuskatsiyalangan faylning baytlari.
         * @returns {Uint8Array} Deobfuskatsiyalangan faylning baytlari.
         */
        const deobfuscatePdf = (obfuscatedBytes) => {
            const deobfuscated = new Uint8Array(obfuscatedBytes.length);
            for (let i = 0; i < obfuscatedBytes.length; i++) {
                deobfuscated[i] = obfuscatedBytes[i] ^ XOR_KEY;
            }
            return deobfuscated;
        };

        /**
         * Ilovaning sahifasini ko'rsatish funksiyasi.
         * @param {string} pageName Ko'rsatiladigan sahifaning nomi ('subjects', 'topics', 'document').
         */
        const showPage = (pageName) => {
            state.currentPage = pageName;
            elements.subjectsPage.classList.add('hidden');
            elements.topicsPage.classList.add('hidden');
            elements.documentPage.classList.add('hidden');
            switch (pageName) {
                case 'subjects':
                    elements.subjectsPage.classList.remove('hidden');
                    break;
                case 'topics':
                    elements.topicsPage.classList.remove('hidden');
                    break;
                case 'document':
                    elements.documentPage.classList.remove('hidden');
                    break;
            }
            // `showPage` endi `updateUI` ni chaqirmaydi, chunki bu cheksiz tsiklga sabab bo'lardi.
        };

        /**
         * Yuklanish holatini boshqarish.
         * @param {boolean} isLoading Yuklanish holati.
         */
        const setLoading = (isLoading) => {
            state.loading = isLoading;
            updateUI();
        };

        /**
         * Xato xabarini ko'rsatish.
         * @param {string|null} message Ko'rsatiladigan xato xabari.
         */
        const setError = (message) => {
            state.error = message;
            updateUI();
        };
        
        /**
         * Modal xabarini ko'rsatish.
         * @param {string} message Xabar matni.
         */
        const showModal = (message) => {
            elements.modalText.innerText = message;
            elements.messageModal.classList.remove('hidden');
        };

        /**
         * Modal xabarini yopish.
         */
        const closeModal = () => {
            elements.messageModal.classList.add('hidden');
        };

        /**
         * UI elementlarini yangilash.
         */
        const updateUI = () => {
            if (state.loading) {
                elements.appContainer.classList.add('hidden');
                elements.loader.classList.remove('hidden');
                elements.errorMessage.classList.add('hidden');
            } else if (state.error) {
                elements.appContainer.classList.add('hidden');
                elements.loader.classList.add('hidden');
                elements.errorMessage.classList.remove('hidden');
                elements.errorMessage.innerText = `Xatolik yuz berdi: ${state.error}`;
            } else {
                elements.appContainer.classList.remove('hidden');
                elements.loader.classList.add('hidden');
                elements.errorMessage.classList.add('hidden');
                
                // Endi `updateUI` funksiyasi `showPage` ni chaqirmaydi.
                // Uning o'rniga, `showPage` ichidagi mantiqni to'g'ridan-to'g'ri chaqiramiz.
                elements.subjectsPage.classList.add('hidden');
                elements.topicsPage.classList.add('hidden');
                elements.documentPage.classList.add('hidden');
                switch (state.currentPage) {
                    case 'subjects':
                        elements.subjectsPage.classList.remove('hidden');
                        break;
                    case 'topics':
                        elements.topicsPage.classList.remove('hidden');
                        break;
                    case 'document':
                        elements.documentPage.classList.remove('hidden');
                        break;
                }
                
                // Sahifa navigatsiya tugmalarini yangilash
                if (state.currentPage === 'document') {
                    elements.prevPageBtn.disabled = state.pageNumber <= 1;
                    elements.nextPageBtn.disabled = state.pageNumber >= state.numPages;
                    elements.pageInfo.innerText = `Sahifa ${state.pageNumber} / ${state.numPages || '...'}`;
                }
            }
        };

        /**
         * Fanlar ro'yxatini yuklash funksiyasi.
         */
        const fetchSubjects = async () => {
            setLoading(true);
            setError(null);
            try {
                const response = await fetch(SUBJECTS_URL);
                if (!response.ok) {
                    throw new Error("Fanlar ro'yxatini yuklashda xato.");
                }
                const data = await response.json();
                state.subjects = data.subjects;
                renderSubjects();
                showPage('subjects');
            } catch (e) {
                setError(e.message);
            } finally {
                setLoading(false);
            }
        };

        /**
         * Mavzular ro'yxatini yuklash funksiyasi.
         * @param {object} subject Tanlangan fan obyekti.
         */
        const fetchTopics = async (subject) => {
            setLoading(true);
            setError(null);
            state.selectedSubject = subject;
            try {
                const response = await fetch(subject.topic_list_url);
                if (!response.ok) {
                    throw new Error("Mavzular ro'yxatini yuklashda xato.");
                }
                const data = await response.json();
                state.topics = data;
                renderTopics();
                showPage('topics');
            } catch (e) {
                setError(e.message);
            } finally {
                setLoading(false);
            }
        };

        /**
         * PDF faylini yuklash va ko'rsatish funksiyasi.
         * @param {string} documentUrl Yuklanadigan hujjatning URL manzili.
         */
        const fetchAndRenderPdf = async (documentUrl) => {
            setLoading(true);
            setError(null);
            state.selectedDocumentUrl = documentUrl;
            state.pdfRef = null;
            state.pageNumber = 1;
            state.numPages = null;
            
            // `pdf.js` yuklanganligini tekshirish
            if (!window.pdfjsLib) {
                setError("PDF kutubxonasi hali yuklanmagan. Iltimos, bir oz kuting va qayta urinib ko'ring.");
                return;
            }

            try {
                const response = await fetch(documentUrl);
                if (!response.ok) {
                    throw new Error("Hujjatni yuklashda xato. Serverga ulanish amalga oshmadi.");
                }
                const obfuscatedArrayBuffer = await response.arrayBuffer();
                const deobfuscatedBytes = deobfuscatePdf(new Uint8Array(obfuscatedArrayBuffer));
                
                const loadingTask = window.pdfjsLib.getDocument({ data: deobfuscatedBytes });
                const pdf = await loadingTask.promise;
                state.pdfRef = pdf;
                state.numPages = pdf.numPages;
                showPage('document');
                renderPage(); // PDFni birinchi sahifasini ko'rsatish
            } catch (e) {
                setError(`Xatolik: ${e.message}. Fayl noto'g'ri shaklda yoki shikastlangan bo'lishi mumkin.`);
                console.error("PDFni yuklashda xato:", e);
            } finally {
                setLoading(false);
            }
        };

        /**
         * PDF sahifasini canvasga chizish.
         */
        const renderPage = async () => {
            if (state.pdfRef && state.pageNumber && elements.pdfCanvas) {
                const page = await state.pdfRef.getPage(state.pageNumber);
                const container = elements.pdfCanvas.parentElement;

                const viewport = page.getViewport({ scale: 1 });
                const scale = container.clientWidth / viewport.width;
                const scaledViewport = page.getViewport({ scale: scale });

                const context = elements.pdfCanvas.getContext('2d');
                elements.pdfCanvas.height = scaledViewport.height;
                elements.pdfCanvas.width = scaledViewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport,
                };
                await page.render(renderContext).promise;
            }
            updateUI();
        };

        /**
         * Fanlar ro'yxatini HTMLga chizish funksiyasi.
         */
        const renderSubjects = () => {
            elements.subjectsList.innerHTML = state.subjects.map((subject, index) => `
                <div
                    class="p-6 bg-white rounded-xl shadow-md flex flex-col items-center text-center cursor-pointer transition-transform transform hover:scale-105"
                    data-subject-index="${index}"
                >
                    <div class="text-3xl mb-2">${subject.emoji}</div>
                    <h3 class="text-lg font-semibold">${subject.name}</h3>
                </div>
            `).join('');

            // Har bir fan elementiga event listener qo'shish
            document.querySelectorAll('#subjects-list > div').forEach(item => {
                item.addEventListener('click', () => {
                    const index = item.getAttribute('data-subject-index');
                    const subject = state.subjects[index];
                    if (subject.topic_list_url) {
                        fetchTopics(subject);
                    } else {
                        showModal("Tez orada qo'shiladi!");
                    }
                });
            });
        };

        /**
         * Mavzular ro'yxatini HTMLga chizish funksiyasi.
         */
        const renderTopics = () => {
            elements.topicsTitle.innerText = state.selectedSubject.name;
            elements.topicsList.innerHTML = state.topics.map(category => `
                <div>
                    <div class="flex items-center mb-4">
                        <span class="text-2xl mr-2">${category.icon_emoji}</span>
                        <h3 class="text-xl md:text-2xl font-bold">${category.category_name}</h3>
                    </div>
                    <div class="space-y-2 ml-4 border-l-2 border-gray-200 pl-4">
                        ${category.guides.map(guide => `
                            <div
                                class="flex items-center p-3 rounded-lg bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors"
                                data-document-url="${guide.document_url}"
                            >
                                <span class="text-xl mr-2">${guide.icon_emoji}</span>
                                <span class="text-base md:text-lg">${guide.title}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Har bir hujjat elementiga event listener qo'shish
            document.querySelectorAll('#topics-list [data-document-url]').forEach(item => {
                item.addEventListener('click', () => {
                    const url = item.getAttribute('data-document-url');
                    fetchAndRenderPdf(url);
                });
            });
        };

        /**
         * Ilovaning ishlashini boshlash.
         */
        const init = () => {
            // Event listenerlarni o'rnatish
            elements.backToSubjectsBtn.addEventListener('click', () => showPage('subjects'));
            elements.backToTopicsBtn.addEventListener('click', () => showPage('topics'));
            elements.prevPageBtn.addEventListener('click', () => {
                state.pageNumber = Math.max(state.pageNumber - 1, 1);
                renderPage();
            });
            elements.nextPageBtn.addEventListener('click', () => {
                state.pageNumber = Math.min(state.pageNumber + 1, state.numPages);
                renderPage();
            });
            elements.modalCloseBtn.addEventListener('click', closeModal);
            window.addEventListener('resize', renderPage);

            // Boshlang'ich ma'lumotlarni yuklash
            fetchSubjects();
        };

        // DOM to'liq yuklangach, ilovani ishga tushirish
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
