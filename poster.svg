<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1100" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
    <style><![CDATA[
      .title { font-family: sans-serif; font-size: 42px; fill: #ffffff; font-weight: bold; }
      .subtitle { font-family: sans-serif; font-size: 22px; fill: #e0f2f1; }
      .card-title { font-family: sans-serif; font-size: 24px; fill: #ffffff; font-weight: 600; }
      .card-text { font-family: sans-serif; font-size: 16px; fill: #cfd8dc; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="url(#bgGradient)" />

  <!-- Title -->
  <text x="40" y="80" class="title">📛 UstaMakon</text>
  <text x="40" y="120" class="subtitle">Sizning Raqamli Ustaxonangiz – Mustaqil. Halol. Oddiy.</text>

  <!-- Card 1 -->
  <rect x="50" y="160" width="700" height="230" rx="20" fill="#00796b" opacity="0.9"/>
  <text x="70" y="200" class="card-title">👥 Kimlar Uchun?</text>
  <text x="70" y="235" class="card-text">• Har kuni telefon foydalanuvchilari (ota-onalar, buvilar)</text>
  <text x="70" y="265" class="card-text">• Kompyuterni ishlatib, ustaga qaramlar</text>
  <text x="70" y="295" class="card-text">• Yoshlar, o‘qituvchilar, buxgalterlar</text>
  <text x="70" y="325" class="card-text">• Texnologiya bilan do‘stlashmoqchilar</text>

  <!-- Card 2 -->
  <rect x="50" y="420" width="700" height="230" rx="20" fill="#00695c" opacity="0.9"/>
  <text x="70" y="460" class="card-title">🧱 Nima Beradi?</text>
  <text x="70" y="495" class="card-text">• Qurilmani buzmay sozlashni o‘rgatadi</text>
  <text x="70" y="525" class="card-text">• To‘liq nazorat va tushuncha beradi</text>
  <text x="70" y="555" class="card-text">• Raqamli savodli shaxsga aylantiradi</text>
  <text x="70" y="585" class="card-text">• Shaxsiy texnik yordamchiga aylanadi</text>

  <!-- Card 3 -->
  <rect x="50" y="680" width="700" height="230" rx="20" fill="#004d40" opacity="0.9"/>
  <text x="70" y="720" class="card-title">🤝 Hamkorlik</text>
  <text x="70" y="755" class="card-text">• Dasturchilar, tarjimonlar, ustalar (ko‘ngillilik asosida)</text>
  <text x="70" y="785" class="card-text">• Ochiq kodli, JAMOAVIY rivojlanish</text>
  <text x="70" y="815" class="card-text">• Hech qanday zararli yondashuv yo‘q</text>
  <text x="70" y="845" class="card-text">• Jamoa bilan, foydalanuvchi foydasi uchun!</text>

  <!-- Footer -->
  <text x="40" y="1040" class="subtitle">🌐 usta.makon – Bepul. Oflayn. Maxfiy. Siz uchun.</text>
</svg>
